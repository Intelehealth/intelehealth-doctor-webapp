name: Deploy Webapp Unilateral
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Host to deploy to"
        type: choice
        default: all
        options:
          - all
          - dev
          - turn
          - ttxai
          - testturn
          - nasprod

  push:
    branches:
      - nas-ida5-development-master

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - name: Determine targets
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" != "all" ]; then
            echo "targets=[\"${{ inputs.target }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["dev","turn","ttxai","testturn","nasprod"]' >> "$GITHUB_OUTPUT"

          fi

  build-and-deploy:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.set-matrix.outputs.targets) }}
    concurrency:
      group: webapp-deploy-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve deploy host
        id: resolve
        run: |
          case "${{ matrix.target }}" in
            dev)
              echo "host=${{ secrets.DEV_HOST }}" >> "$GITHUB_OUTPUT"
              ;;
            turn)
              echo "host=${{ secrets.TURN_HOST }}" >> "$GITHUB_OUTPUT"
              ;;
            ttxai)
              echo "host=${{ secrets.TTXAI_HOST }}" >> "$GITHUB_OUTPUT"
              ;;
            testturn)
              echo "host=${{ secrets.TESTTURN_HOST }}" >> "$GITHUB_OUTPUT"
              ;;
            nasprod)
              echo "host=${{ secrets.NAS_HOST }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown matrix target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

      - name: Validate deployment host
        env:
          DEPLOY_HOST: ${{ steps.resolve.outputs.host }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Deploy host is empty for target: ${{ matrix.target }}. Check that the corresponding secret is configured." >&2
            exit 1
          fi

          echo "Validating target host for ${{ matrix.target }}: $DEPLOY_HOST"
          if ! getent hosts "$DEPLOY_HOST" >/dev/null 2>&1; then
            echo "The host '$DEPLOY_HOST' was not resolvable from the GitHub runner. If the server is reachable only by IP, set the secret to the direct IP address instead of the DNS name." >&2
            exit 1
          fi

      - name: Download .env via Native SCP
        env:
          DEPLOY_HOST: ${{ steps.resolve.outputs.host }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$REMOTE_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing required deployment environment variables. Check DEPLOY_HOST, REMOTE_USER, and SSH_PRIVATE_KEY." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if ! ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Unable to resolve or connect to host '$DEPLOY_HOST'. Verify the hostname or use the server IP directly in the secret." >&2
            exit 1
          fi

          chmod 644 ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$REMOTE_USER@$DEPLOY_HOST:/home/ubuntu/deploy/webapp/.env" .env

      - name: Build and Save Docker Image
        run: |
          mv .env ./ || true
          docker build -t intelehealth-webapp:latest .
          docker save intelehealth-webapp:latest | gzip > webapp_image.tar.gz

      - name: Upload Image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve.outputs.host }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "webapp_image.tar.gz"
          target: "/home/ubuntu/deploy/webapp/"

      - name: Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.resolve.outputs.host }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/deploy/webapp/
            gunzip -c webapp_image.tar.gz | docker load
            docker stop webapp-container || true
            docker rm webapp-container || true
            docker run -d \
              --name webapp-container \
              -p 81:80 \
              --env-file /home/ubuntu/deploy/webapp/.env \
              intelehealth-webapp:latest
            rm /home/ubuntu/deploy/webapp/webapp_image.tar.gz

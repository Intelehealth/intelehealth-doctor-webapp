name: nas-ida5-web

on:
  push:
    branches:
      - nas-ida5-development-master
    tags:
      - 'v*'          # e.g. v1.0.0, v2.3.1
  workflow_dispatch:  # Allows manual trigger

# Prevent two deployments to the same branch from overlapping
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Deploy to ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # A failure on one server doesn't cancel the other
      matrix:
        include:
          - name: nas-staging-new
            host_secret: NASSTAGINGNEW_HOST
          - name: nas-prod
            host_secret: NASPROD_HOST

    env:
      DEPLOY_HOST: ${{ secrets[matrix.host_secret] }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Fetch this server's .env to use during the build
      - name: Download .env via Native SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/id_rsa ${{ secrets.REMOTE_USER }}@"$DEPLOY_HOST":/home/ubuntu/deploy/webapp/.env .env

      # STEP 2: Build the Docker image (built separately per server,
      # because each server's .env is baked in at build time)
      - name: Build and Save Docker Image
        run: |
          docker build -t intelehealth-webapp:latest .
          docker save intelehealth-webapp:latest | gzip > webapp_image.tar.gz

      # STEP 3: Transfer the built image to the server
      - name: Upload Image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "webapp_image.tar.gz"
          target: "/tmp"

      # STEP 4: Restart the container
      - name: Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /tmp
            gunzip -c webapp_image.tar.gz | docker load

            docker stop webapp-container || true
            docker rm webapp-container || true

            # --restart unless-stopped: come back automatically after
            # Docker daemon restarts or server reboots
            docker run -d \
              --name webapp-container \
              --restart unless-stopped \
              -p 81:80 \
              --env-file /home/ubuntu/deploy/webapp/.env \
              intelehealth-webapp:latest

            # Clean up the uploaded archive and old dangling images
            rm -f /tmp/webapp_image.tar.gz
            docker image prune -f

name: Demoai
on:
  push:
    branches:
      - development_master
    paths-ignore:
      - '.github/workflows/**'          # don't deploy when only workflow files change...
      - '!.github/workflows/demoai.yml' # ...except this workflow itself (use your real filename)
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.DEMOAI_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote deployment directory exists
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.REMOTE_USER }}@${{ secrets.DEMOAI_HOST }}" "mkdir -p /home/ubuntu/deploy/webapp"

      # STEP 1: Fetch the .env from the server to use during the build
      - name: Download .env via Native SCP
        run: |
          if ssh -i ~/.ssh/id_rsa "${{ secrets.REMOTE_USER }}@${{ secrets.DEMOAI_HOST }}" "[ -f /home/ubuntu/deploy/webapp/.env ]"; then
            scp -i ~/.ssh/id_rsa "${{ secrets.REMOTE_USER }}@${{ secrets.DEMOAI_HOST }}:/home/ubuntu/deploy/webapp/.env" .env
          else
            echo "Remote .env not found. Creating an empty local fallback so the workflow can continue."
            : > .env
          fi

          mv .env ./ || true

      # STEP 2: Build the Docker image (Dockerfile will now find the .env)
      - name: Build and Save Docker Image
        run: |
          docker build -t intelehealth-webapp:latest .
          docker save intelehealth-webapp:latest | gzip > webapp_image.tar.gz

      # STEP 3: Transfer the built image back to the server
      - name: Upload Image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEMOAI_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "webapp_image.tar.gz"
          target: "/home/ubuntu/deploy/webapp/"

      # STEP 4: Restart the container
      - name: Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEMOAI_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/deploy/webapp
            touch /home/ubuntu/deploy/webapp/.env

            cd /home/ubuntu/deploy/webapp/
            gunzip -c webapp_image.tar.gz | docker load

            docker stop webapp-container || true
            docker rm webapp-container || true

            # Note: We still mount the .env at runtime just in case
            # your Node server (SSR) or Docker entrypoint needs it.
            docker run -d \
              --name webapp-container \
              -p 83:80 \
              --env-file /home/ubuntu/deploy/webapp/.env \
              intelehealth-webapp:latest

            rm -f webapp_image.tar.gz

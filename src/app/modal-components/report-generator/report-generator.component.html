<div class="create-report-modal">
  <div class="modal-title">
    <h6 class="mb-0">{{ data.title }}</h6>
    <button class="modal-close-btn" (click)="close()"><img src="assets/svgs/Close.svg" alt=""
        data-test-id="btnClose"></button>
  </div>
  <div class="modal-body">
    <form class="report-form" [formGroup]="reportForm" (ngSubmit)="generateReport()">
      <div class="input-field-group">
        <label>{{data.field1}}</label>
        <div class="input-wrapper">
          <input type="text" class="form-control" formControlName="field1" [matDatepicker]="dobdp" placeholder="{{'Select date' | translate}}" aria-label="Date" aria-describedby="basic-addon1" readonly data-test-id="etDate"/>
          <mat-datepicker #dobdp></mat-datepicker>
          <mat-datepicker-toggle matSuffix [for]="dobdp" data-test-id="dpDate" class="datepicker-icon">
            <img matDatepickerToggleIcon src="assets/svgs/calendar-date.svg" alt="">
          </mat-datepicker-toggle>
        </div>

        <small class="text-danger" *ngIf="submitted && f.field1.errors">*{{'Required'|translate}}</small>
      </div>
      <div class="input-field-group">
        <label>{{data.field2}}</label>
        <div class="input-wrapper">
          <input type="text" class="form-control" formControlName="field2" [matDatepicker]="dobdp" placeholder="{{'Select date' | translate}}" aria-label="Date" aria-describedby="basic-addon1" readonly data-test-id="etDate"/>
          <mat-datepicker #dobdp></mat-datepicker>
          <mat-datepicker-toggle matSuffix [for]="dobdp" data-test-id="dpDate" class="datepicker-icon">
            <img matDatepickerToggleIcon src="assets/svgs/calendar-date.svg" alt="">
          </mat-datepicker-toggle>
        </div>

        <small class="text-danger" *ngIf="submitted && f.field2.errors">*{{'Required'|translate}}</small>
        <small class="text-danger" *ngIf="isDatesValid">{{'Start date should not be greater than end date'|translate}}</small>
      </div>
      <div class="d-flex justify-content-center">
        <button class="cancel-btn mr-3" type="button" (click)="close()" data-test-id="btnCancel">{{ data.cancelBtnText
          }}</button>
        <button class="confirm-btn" type="submit" data-test-id="btnSubmit" [disabled]="isDatesValid">{{
          data.confirmBtnText }}</button>
      </div>
    </form>
  </div>
</div>

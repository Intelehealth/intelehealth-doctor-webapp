<div class="create-report-modal">
  <div class="modal-title">
    <h6 class="mb-0">{{ data.title }}</h6>
    <button class="modal-close-btn" (click)="close()"><img src="assets/svgs/Close.svg" alt=""
        data-test-id="btnClose"></button>
  </div>
  <div class="modal-body">
    <form class="report-form" [formGroup]="reportForm" (ngSubmit)="generateReport()">
      <div class="input-field-group">
        <label>{{data.field1}}</label>
        <div class="input-wrapper">
          <input type="text" [max]="today" [matDatepicker]="picker1" formControlName="field1"
            placeholder="{{'Select date' | translate}}" readonly data-test-id="field1">
          <mat-datepicker #picker1></mat-datepicker>
          <mat-datepicker-toggle matSuffix [for]="picker1" class="datepicker-icon">
            <img matDatepickerToggleIcon src="assets/svgs/calendar-date.svg" alt="">
          </mat-datepicker-toggle>
        </div>
        <small class="text-danger" *ngIf="submitted && f.field1.errors">*Required</small>
      </div>
      <div class="input-field-group">
        <label>{{data.field2}}</label>
        <div class="input-wrapper">
          <input type="text" [max]="today" [matDatepicker]="picker2" formControlName="field2"
            placeholder="{{'Select date' | translate}}" readonly data-test-id="field2">
          <mat-datepicker #picker2></mat-datepicker>
          <mat-datepicker-toggle matSuffix [for]="picker2" class="datepicker-icon">
            <img matDatepickerToggleIcon src="assets/svgs/calendar-date.svg" alt="">
          </mat-datepicker-toggle>
        </div>
        <small class="text-danger" *ngIf="submitted && f.field2.errors">*Required</small>
        <small class="text-danger" *ngIf="isDatesValid">Start date should not be greater than end date</small>
      </div>
      <div class="input-field-group" *ngIf="data.field3">
        <label>{{data.field3}}</label>
        <input type="email" placeholder="Enter email address" formControlName="field3" data-test-id="field3">
        <small class="text-danger" *ngIf="submitted && f.field3.errors?.required">*Required</small>
        <small class="text-danger" *ngIf="submitted && !f.field3.errors?.required && f.field3.errors?.email">*Enter a valid email address</small>
      </div>
      <div class="d-flex justify-content-center">
        <button class="cancel-btn mr-3" type="button" (click)="close()" data-test-id="btnCancel">{{ data.cancelBtnText
          }}</button>
        <button class="confirm-btn" type="submit" data-test-id="btnSubmit" [disabled]="isDatesValid">{{
          data.confirmBtnText }}</button>
      </div>
    </form>
  </div>
</div>

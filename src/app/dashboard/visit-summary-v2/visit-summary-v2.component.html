<div class="vs2-page">

  <app-patient-header-card *ngIf="patient" [patient]="patient"></app-patient-header-card>

  <div class="vs2-body">

    <app-visit-sidebar
      [visitScopeTabs]="visitScopeTabs"
      [activeVisitScope]="activeVisitScope"
      [sections]="sections"
      [noteNavGroups]="noteNavGroups"
      [activeSection]="activeSection"
      [pastVisitsTimeline]="pastVisitsTimeline"
      [activePastVisitKey]="activePastVisitKey"
      (scopeChange)="setVisitScope($event)"
      (sectionSelect)="selectSection($event)"
      (pastVisitSelect)="selectPastVisit($event)">
    </app-visit-sidebar>

    <div class="vs2-right">

      <ng-container *ngIf="activeVisitScope === 'Current visits'">

        <div class="vs2-top-tabs">
          <button
            *ngFor="let tab of visibleTopTabs"
            class="vs2-top-tab"
            [class.active]="activeTopTab === tab"
            (click)="setTopTab(tab)">
            {{ tab }}
          </button>
        </div>

        <!-- Collapsible cards: Current visits, then the doctor's note(s). One opens at a time from the tabs. -->
        <main class="vs2-content vs2-content-cards">

          <div class="vs2-card" id="card-current-visits">
            <div class="vs2-card-header" (click)="toggleCard(currentVisitsTab)">
              <h2>{{ currentVisitsTab }}</h2>
              <mat-icon>{{ expandedCards[currentVisitsTab] ? 'expand_less' : 'expand_more' }}</mat-icon>
            </div>
            <div class="vs2-card-body" [hidden]="!expandedCards[currentVisitsTab]">
              <ng-container [ngTemplateOutlet]="currentVisitDetails"></ng-container>
            </div>
          </div>

          <div class="vs2-card" id="card-primary-note" *ngIf="isNamcoDoctorLoggedIn && primaryVisitNoteUuid">
            <div class="vs2-card-header" (click)="toggleCard(primaryNoteTab)">
              <h2>{{ primaryNoteTab }}</h2>
              <mat-icon>{{ expandedCards[primaryNoteTab] ? 'expand_less' : 'expand_more' }}</mat-icon>
            </div>
            <div class="vs2-card-body" [hidden]="!expandedCards[primaryNoteTab]">
              <app-primary-note-view
                [patientUuid]="patientUuid"
                [visitUuid]="visitId"
                [primaryVisitNoteUuid]="primaryVisitNoteUuid"
                [patientPhoneNo]="patient?.contactNo || ''"
                [visit]="visit">
              </app-primary-note-view>
            </div>
          </div>

          <!-- Doctor's Note (normal doctor) or Specialist Doctor's Note (NAMCO doctor) -->
          <div class="vs2-card" id="section-doctor-note" *ngIf="visitNoteStarted">
            <div class="vs2-card-header" (click)="toggleCard(noteTab)">
              <h2>{{ noteTab }}</h2>
              <mat-icon>{{ expandedCards[noteTab] ? 'expand_less' : 'expand_more' }}</mat-icon>
            </div>
            <!-- [hidden] rather than *ngIf, so collapsing keeps in-progress entries and AI results -->
            <div class="vs2-card-body" [hidden]="!expandedCards[noteTab]">
              <app-doctor-note
                *ngIf="!isNamcoDoctorLoggedIn"
                [patientUuid]="patientUuid"
                [patientPhoneNo]="patient?.contactNo"
                [visit]="visit"
                [patientInfo]="patientModel"
                [visitCompleted]="visitEnded"
                [visitReferred]="visitReferred"
                [visitUuid]="visitId"
                [visitNoteUuid]="visitNoteUuid">
              </app-doctor-note>

              <app-specialist-doctor-note
                *ngIf="isNamcoDoctorLoggedIn"
                [patientUuid]="patientUuid"
                [patientPhoneNo]="patient?.contactNo || ''"
                [visit]="visit"
                [visitCompleted]="visitCompleted"
                [visitUuid]="visitId"
                [visitNoteUuid]="visitNoteUuid"
                [noteEncounterUuids]="noteEncounterUuids">
              </app-specialist-doctor-note>
            </div>
          </div>

        </main>

        <ng-template #currentVisitDetails>
          <app-current-visit-details
            [consultationDetails]="consultationDetails"
            [chiefComplaints]="chiefComplaints"
            [complaintDetails]="complaintDetails"
            [associatedSymptoms]="associatedSymptoms"
            [patientHistory]="patientHistory"
            [familyHistory]="familyHistory"
            [vitals]="vitals"
            [generalExams]="generalExams"
            [eyeImages]="eyeImages"
            [abdomenFindings]="abdomenFindings"
            [documents]="documents"
            [chwNote]="chwNote"
            [specializations]="specializations"
            [referToSpecialistEnabled]="referToSpecialistEnabled"
            [visitNoteStarted]="visitNoteStarted"
            (startVisit)="startVisitNote()"
            (reassign)="reassignVisit($event)">
          </app-current-visit-details>
        </ng-template>
      </ng-container>

      <ng-container *ngIf="activeVisitScope === 'Past Visits'">
        <app-past-visits *ngIf="activePastVisit" [visit]="activePastVisit"></app-past-visits>
      </ng-container>

    </div>
  </div>

  <div class="vs2-webrtc-controls" *ngIf="canStartCall">
    <img *ngIf="hasAudioEnabled" class="vs2-webrtc-btn vs2-webrtc-btn-audio" src="assets/svgs/audio-call.svg"
         alt="Start Audio Call" data-test-id="imgStartAudioCall" (click)="startCall('audio')" />
    <img *ngIf="hasVideoEnabled" class="vs2-webrtc-btn" src="assets/svgs/video-frame.svg"
         alt="Start Video Call" data-test-id="imgStartVideoCall" (click)="startCall('video')" />
    <img *ngIf="hasChatEnabled" class="vs2-webrtc-btn" src="assets/svgs/chat-icon-blue-circle.svg"
         alt="Start Chat" data-test-id="imgStartChat" (click)="startChat()" />
  </div>
</div>
